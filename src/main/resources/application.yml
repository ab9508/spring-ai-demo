server:
  port: 8080

app:
  chat:
    provider: openai    # 切换模型：ollama（本地免费，内存不足运行慢,需要删除<think></think>之间内容） | openai（DeepSeek API）

spring:
  application:
    name: spring-ai-demo
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: postgres
    password: ${DB_PASSWORD:123456}          # 优先读环境变量，无则使用默认值
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  ai:
    # ============ 向量存储 ============
    vectorstore:
      pgvector:
        initialize-schema: true    # 自动创建向量表（首次启动用）
        dimensions: 768             # nomic-embed-text 的维度

    # ============ Ollama 本地模型（默认使用，不支持tool） HTTP 400 - {"error":"registry.ollama.ai/library/deepseek-r1:8b does not support tools"} ============
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: deepseek-r1:8b
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text

    # ============ DeepSeek API（通过 app.chat.provider=openai 切换） ============
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-xxx}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
      embedding:
        enabled: false     # Ollama 已提供 Embedding，禁用 OpenAI 的

# 调试时开启详细日志
logging:
  level:
    com.example.ai.config: DEBUG
    com.example.ai.tool: DEBUG
    com.example.ai.controller: DEBUG
