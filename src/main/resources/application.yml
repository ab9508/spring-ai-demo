server:
  port: 8080

app:
  chat:
    provider: ollama     # 切换模型：ollama（qwen2.5:3b本地，失败降级DeepSeek API） | openai（DeepSeek API直连）
  degradation:
    timeout: 15s         # 单次模型调用超时时间（超时自动切到降级模型）
    fallback: "服务繁忙，请稍后再试"  # 全部模型失败时的兜底回复
  rate-limit:
    user:
      capacity: 20       # 每用户令牌桶容量（最大突发请求数）
      refill-rate: 1     # 每次补充的令牌数
      refill-interval-ms: 3000  # 补充间隔（毫秒）→ 约 20次/分钟
    global:
      daily-max: 10000   # 全局每日调用上限（成本预算管控）

spring:
  application:
    name: spring-ai-demo
  # 默认激活 dev 环境（不指定 profile 时自动使用）
  # 切换到另一台机器：--spring.profiles.active=test
  profiles:
    default: test
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: postgres
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  ai:
    # ============ 向量存储 ============
    vectorstore:
      pgvector:
        initialize-schema: true    # 自动创建向量表（首次启动用）
        dimensions: 1024            # bge-large-zh-v1.5 的维度

    # ============ Ollama 本地模型（qwen2.5:3b） ============
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:3b
          temperature: 0.7
      embedding:
        options:
          model: smartcreation/bge-large-zh-v1.5

    # ============ DeepSeek API（通过 app.chat.provider=openai 切换） ============
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-xxx}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
      embedding:
        enabled: false     # Ollama 已提供 Embedding，禁用 OpenAI 的

# 调试时开启详细日志
logging:
  level:
    com.example.ai.config: DEBUG
    com.example.ai.tool: DEBUG
    com.example.ai.controller: DEBUG
