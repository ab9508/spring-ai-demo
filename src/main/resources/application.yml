server:
  port: 8080

spring:
  application:
    name: spring-ai-demo
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: postgres
    password: ${DB_PASSWORD:123456}          # 优先读环境变量，无则使用默认值
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true    # 自动创建向量表（首次启动用）
        dimensions: 768             # nomic-embed-text 的维度
  # ============ AI 配置 ============
  # Chat 对话：DeepSeek（spring-ai-starter-model-openai 自动装配读取此配置）
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

  # Embedding：Ollama 本地（在 SpringAiDemoApplication 中手动创建 Bean，不走 yml 配置）
  # 确保本地已执行：ollama pull nomic-embed-text && ollama serve
  # Redis ChatMemory：手写 RedisChatMemoryRepository 实现（见 config 包），key 前缀 chat:memory:{conversationId}
# 调试时开启详细日志
logging:
  level:
    com.example.ai.config.RedisChatMemoryRepository: DEBUG
    com.example.ai.tool.OrderTools: DEBUG
    com.example.ai.controller.AgentController: DEBUG
